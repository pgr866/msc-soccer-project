name: CI Spring Microservices

on:
  push:
    branches: [ main ]
    paths:
      - 'config-server/**'
      - 'eureka-server/**'
      - 'gateway/**'
      - 'player-service/**'
      - 'comment-service/**'
      - 'dream-team-service/**'
      - '.github/workflows/spring-*.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'config-server/**'
      - 'eureka-server/**'
      - 'gateway/**'
      - 'player-service/**'
      - 'comment-service/**'
      - 'dream-team-service/**'
      - '.github/workflows/spring-*.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [config-server, eureka-server, gateway, player-service, comment-service, dream-team-service]
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        run: mvn -B -f ${{ matrix.service }}/pom.xml clean verify

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/TEST-*.xml

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: jacoco-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/jacoco.xml

  report:
    needs: build
    if: needs.build.result == 'success' || needs.build.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: artifacts/test-results
          merge-multiple: true

      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-report-*
          path: artifacts/jacoco

      - name: Run Test Reporter
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: JUnit Tests
          path: "artifacts/test-results/TEST-*.xml"
          reporter: java-junit

      - name: Add coverage to PR
        uses: madrapps/jacoco-report@v1.7.2
        if: github.event_name == 'pull_request' && (success() || failure())
        with:
          paths: artifacts/jacoco/jacoco-report-*/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Run Checkstyle
        uses: dbelyaev/action-checkstyle@v3
        if: success() || failure()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: sun_checks.xml
          level: warning
          reporter: github-check
          exclude: |
            ./.github
            ./docs
            ./corba-app
            ./firebase-emulator
            ./node-api
            ./ionic-app

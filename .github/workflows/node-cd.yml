name: CD Node API

on:
  workflow_run:
    workflows: ['CI Node API']
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  GCP_PROJECT: "cnsa2026-pgr866"
  GCP_PROJECT_NUMBER: "454162328788"
  REGION: "us-east1"
  REPO_NAME: "docker-repo"
  IMAGE_NAME: "node-api"
  MDB_DB_HOST: "cluster0.fdgmtfo.mongodb.net"
  MDB_DB_NAME: "msc-soccer-project"
  MDB_APP_NAME: "Cluster0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
            IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}"
            docker build --target production -t $IMAGE_PATH:${{ github.sha }} -f node-api/Dockerfile node-api
            docker tag $IMAGE_PATH:${{ github.sha }} $IMAGE_PATH:latest
            docker push $IMAGE_PATH:${{ github.sha }}
            docker push $IMAGE_PATH:latest

      - name: Encode Firebase Account Service JSON Key
        id: encode_key
        run: |
          ENCODED=$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | base64 -w 0)
          echo "::add-mask::$ENCODED"
          echo "FIREBASE_SERVICE_ACCOUNT_B64=$ENCODED" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.IMAGE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest
          region: ${{ env.REGION }}
          env_vars: |
            FIREBASE_SERVICE_ACCOUNT_B64=${{ steps.encode_key.outputs.FIREBASE_SERVICE_ACCOUNT_B64 }}
            IONIC_APP_URL=https://ionic-app-${{ env.GCP_PROJECT_NUMBER }}.${{ env.REGION }}.run.app
            CORBA_APP_URL=https://corba-app-${{ env.GCP_PROJECT_NUMBER }}.${{ env.REGION }}.run.app
            MDB_DB_USER=${{ secrets.MDB_DB_USER }}
            MDB_DB_PASSWORD=${{ secrets.MDB_DB_PASSWORD }}
            MDB_DB_HOST=${{ env.MDB_DB_HOST }}
            MDB_DB_NAME=${{ env.MDB_DB_NAME }}
            MDB_APP_NAME=${{ env.MDB_APP_NAME }}
            FOOTBALL_API_KEY=${{ secrets.FOOTBALL_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          flags: >
            --port=3000
            --allow-unauthenticated

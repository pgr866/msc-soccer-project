            SB_DB_HOST=${{ env.SB_DB_HOST }}
            SB_DB_PORT=${{ env.SB_DB_PORT }}
            SB_DB_NAME=${{ env.SB_DB_NAME }}
            SB_DB_USER=${{ secrets.SB_DB_USER }}
            SB_DB_PASSWORD=${{ secrets.SB_DB_PASSWORD }}
          flags: |

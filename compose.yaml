  #     - ./ionic-app:/app
  #     - ionic-cache:/app/node_modules
  #     - $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY:$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY
  #   working_dir: /app
  #   entrypoint: npx cypress open --project .

volumes:
  postgres_data:
  mongo-data:
  node-cache:
  ionic-cache:
  angular-cache:

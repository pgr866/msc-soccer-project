<app-generic-header title="Lista de Jugadores"></app-generic-header>
<ion-content>
  <ion-list>
    @for (player of playerService.players(); track player.id) {
    <ion-item>
      <ion-label>
        <h2>{{ player.name }}</h2>
        <p>{{ player.age }}</p>
      </ion-label>
    </ion-item>
    } @empty {
    <ion-item>Aún no hay jugadores para mostrar.</ion-item>
    }
  </ion-list>
</ion-content>

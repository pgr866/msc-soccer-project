<ion-tabs>
  @if (authService.currentUser()) {
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="news" href="/news">
      <ion-icon aria-hidden="true" name="newspaper-outline"></ion-icon>
      <ion-label>Noticias</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="players" href="/players">
      <ion-icon aria-hidden="true" name="people-outline"></ion-icon>
      <ion-label>Jugadores</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="dream-team" href="/dream-team">
      <ion-icon aria-hidden="true" name="trophy-outline"></ion-icon>
      <ion-label>Equipazos</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
  }
</ion-tabs>
